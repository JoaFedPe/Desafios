paths:
  /products:
    get:
      summary: Obtiene todos los Productos
      tags:
        - Products
      responses:
        "200":
          description: Productos obtenidos satisfactoriamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Products"
        "400":
          description: Error al obtener Productos

  /products/{pid}:
    get:
      summary: Obtiene un producto por id
      tags:
        - Products
      parameters:
        - name: pid
          in: path
          required: true
          description: ID del producto que se solicita
          schema:
            type: string
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Products"
        "400":
          description: Error al buscar producto

    put:
      summary: Se actualiza un producto
      tags:
        - Products
      parameters:
        - name: pid
          in: path
          required: true
          description: ID del producto que se quiere actualizar
          schema:
            type: string  
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/requestBodies/UpdateProduct"          
      responses:
        "200":
          description: Producto actualizado correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Products"
        "400":
          description: Error al actualizar producto

    delete:
      summary: Elimina un producto
      tags:
        - Products
      parameters:
        - name: pid
          in: path
          required: true
          description: ID del producto a eliminar
          schema:
            type: string
      responses:
        '200':
          description: Producto eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Producto eliminado correctamente
        '400':
          description: Error al eliminar producto                        
      
  /createProduct:
    get:
      summary: Obtiene la página donde se pueden crear nuevos prductos
      tags:
        - Products
      responses:
        "200":
          description: Menú para crear productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Products"
        "500":
          description: Error interno     

    post:
      summary: Se crea un nuevo producto
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/requestBodies/CreateProduct"          
      responses:
        "200":
          description: Producto creado correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Products"
        "400":
          description: Error al crear producto

components:
  schemas:
    Products:
      type: object
      properties:
        _id:
          type: string
          description: ID generado en MongoDB
        title:
          type: string
          description: Nombre del producto
        description:
          type: string
          description: Descripción del producto
        code:
          type: string
          description: Código del producto
        price:
          type: number
          description: Precio del producto
        status:
          type: string
          description: Estado del producto
        stock:
          type: number
          description: Stock del producto
        category:
          type: string
          description: Categoria del producto          
      example:
        _id: "1f541bvs6t123bt"
        title: Producto X
        description: Descripción del Producto X
        code: PIBX
        price: 200
        status: "true"
        stock: 10
        category: Hogar

  requestBodies:
    CreateProduct:
      type: object
      properties:
