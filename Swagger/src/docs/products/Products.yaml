        status:
          type: string
          description: Estado del producto
        stock:
          type: number
          description: Stock del producto
        category:
          type: string
          description: Categoria del producto  
      example:
        _id: "1f541bvs6t123bt"
        title: Producto X
        description: Descripción del Producto X
        code: PIBX
        price: 200
        status: "true"
        stock: 10
        category: Hogar  

    UpdateProduct:
      type: object
      properties:
        title:
